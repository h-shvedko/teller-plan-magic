# Production Docker Compose configuration
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates (uncomment and configure for HTTPS)
      # - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - supabase-db
      - supabase-api
    networks:
      - teller-network

  # Production Supabase Database with persistence
  supabase-db:
    image: supabase/postgres:15.1.1.78
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - supabase-db-prod:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - teller-network
    restart: unless-stopped
    # Uncomment for external access (not recommended for production)
    # ports:
    #   - "5432:5432"

  # Production API Gateway
  supabase-api:
    image: supabase/gotrue:v2.143.0
    environment:
      - API_EXTERNAL_URL=${API_EXTERNAL_URL:-https://yourdomain.com}
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?sslmode=disable
      - GOTRUE_SITE_URL=${GOTRUE_SITE_URL:-https://yourdomain.com}
      - GOTRUE_URI_ALLOW_LIST=${GOTRUE_URI_ALLOW_LIST:-https://yourdomain.com}
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_EMAIL_ENABLE_SIGNUP=true
      # Configure with real SMTP for production
      - GOTRUE_SMTP_HOST=${SMTP_HOST}
      - GOTRUE_SMTP_PORT=${SMTP_PORT:-587}
      - GOTRUE_SMTP_USER=${SMTP_USER}
      - GOTRUE_SMTP_PASS=${SMTP_PASS}
      - GOTRUE_SMTP_ADMIN_EMAIL=${ADMIN_EMAIL}
      - GOTRUE_MAILER_AUTOCONFIRM=false
    depends_on:
      - supabase-db
    networks:
      - teller-network
    restart: unless-stopped

  # Production Storage
  supabase-storage:
    image: supabase/storage-api:v0.43.11
    environment:
      - ANON_KEY=${SUPABASE_ANON_KEY}
      - SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - POSTGREST_URL=http://supabase-rest:3000
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      - FILE_SIZE_LIMIT=52428800
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=stub
      - REGION=stub
      - GLOBAL_S3_BUCKET=stub
      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMGPROXY_URL=http://supabase-imgproxy:5001
    volumes:
      - supabase-storage-prod:/var/lib/storage
    depends_on:
      - supabase-db
      - supabase-rest
    networks:
      - teller-network
    restart: unless-stopped

  # Production REST API
  supabase-rest:
    image: postgrest/postgrest:v11.2.2
    environment:
      - PGRST_DB_URI=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - PGRST_DB_USE_LEGACY_GUCS=false
    depends_on:
      - supabase-db
    networks:
      - teller-network
    restart: unless-stopped

volumes:
  supabase-db-prod:
  supabase-storage-prod:

networks:
  teller-network:
    driver: bridge