services:
  # React Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - VITE_SUPABASE_URL=http://localhost:54321
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzA5Nzg2NDAwLCJleHAiOjIwMjUzNjI0MDB9.4t8lQ7NQgDJN8VWNpqpQX4vZJYQjmXa9O7V6M3QNYnE
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - supabase-db
      - supabase-api
    networks:
      - teller-network
    restart: unless-stopped

  # Supabase Database
  supabase-db:
    image: supabase/postgres:15.1.1.78
    ports:
      - "54322:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - teller-network
    restart: unless-stopped

  # Supabase API Gateway
  supabase-api:
    image: supabase/gotrue:v2.143.0
    ports:
      - "54321:8000"
    environment:
      - API_EXTERNAL_URL=http://localhost:54321
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://postgres:postgres@supabase-db:5432/postgres?sslmode=disable
      - GOTRUE_SITE_URL=http://localhost:8080
      - GOTRUE_URI_ALLOW_LIST=http://localhost:8080
      - GOTRUE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_EMAIL_ENABLE_SIGNUP=true
      - GOTRUE_SMTP_HOST=supabase-inbucket
      - GOTRUE_SMTP_PORT=2500
      - GOTRUE_SMTP_USER=fake_mail_user
      - GOTRUE_SMTP_PASS=fake_mail_password
      - GOTRUE_SMTP_ADMIN_EMAIL=admin@example.com
      - GOTRUE_MAILER_AUTOCONFIRM=true
    depends_on:
      - supabase-db
    networks:
      - teller-network
    restart: unless-stopped

  # Supabase Storage
  supabase-storage:
    image: supabase/storage-api:v0.43.11
    ports:
      - "54327:5000"
    environment:
      - ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzA5Nzg2NDAwLCJleHAiOjIwMjUzNjI0MDB9.4t8lQ7NQgDJN8VWNpqpQX4vZJYQjmXa9O7V6M3QNYnE
      - SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE3MDk3ODY0MDAsImV4cCI6MjAyNTM2MjQwMH0.DaYlNEoUrrEn2Ig7tqibS-PHK5XguaM6OAVD7qLi1w
      - POSTGREST_URL=http://supabase-rest:3000
      - PGRST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - DATABASE_URL=postgres://postgres:postgres@supabase-db:5432/postgres
      - FILE_SIZE_LIMIT=52428800
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=stub
      - REGION=stub
      - GLOBAL_S3_BUCKET=stub
      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMGPROXY_URL=http://supabase-imgproxy:5001
    volumes:
      - supabase-storage-data:/var/lib/storage
    depends_on:
      - supabase-db
      - supabase-rest
    networks:
      - teller-network
    restart: unless-stopped

  # Supabase REST API
  supabase-rest:
    image: postgrest/postgrest:v11.2.2
    ports:
      - "54323:3000"
    environment:
      - PGRST_DB_URI=postgres://postgres:postgres@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - PGRST_DB_USE_LEGACY_GUCS=false
    depends_on:
      - supabase-db
    networks:
      - teller-network
    restart: unless-stopped

  # Supabase Studio
  supabase-studio:
    image: supabase/studio:20240101-ce42139
    ports:
      - "54324:3000"
    environment:
      - SUPABASE_URL=http://supabase-api:8000
      - SUPABASE_REST_URL=http://localhost:54323
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzA5Nzg2NDAwLCJleHAiOjIwMjUzNjI0MDB9.4t8lQ7NQgDJN8VWNpqpQX4vZJYQjmXa9O7V6M3QNYnE
      - SUPABASE_SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE3MDk3ODY0MDAsImV4cCI6MjAyNTM2MjQwMH0.DaYlNEoUrrEn2Ig7tqibS-PHK5XguaM6OAVD7qLi1w
    networks:
      - teller-network
    restart: unless-stopped

  # Inbucket (Email testing)
  supabase-inbucket:
    image: inbucket/inbucket:3.0.3
    ports:
      - "54325:9000" # web ui
      - "54326:2500" # smtp
      - "54327:1100" # pop3
    environment:
      - INBUCKET_WEB_ADDR=0.0.0.0:9000
      - INBUCKET_POP3_ADDR=0.0.0.0:1100
      - INBUCKET_SMTP_ADDR=0.0.0.0:2500
    networks:
      - teller-network
    restart: unless-stopped

  # Image Proxy for transformations
  supabase-imgproxy:
    image: darthsim/imgproxy:v3.8.0
    ports:
      - "54328:8080"
    environment:
      - IMGPROXY_BIND=0.0.0.0:8080
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/var/lib/storage
      - IMGPROXY_USE_ETAG=true
    volumes:
      - supabase-storage-data:/var/lib/storage:ro
    networks:
      - teller-network
    restart: unless-stopped

  # Production Build Service
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - production
    networks:
      - teller-network
    restart: unless-stopped

volumes:
  supabase-db-data:
  supabase-storage-data:

networks:
  teller-network:
    driver: bridge